services:
  redis:
    image: redis:alpine
    container_name: warden-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: warden-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=warden
      - POSTGRES_PASSWORD=wardenpass
      - POSTGRES_DB=wardendb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warden -d wardendb"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  echo-backend:
    build:
      context: .
      dockerfile: Dockerfile.echo
    container_name: warden-echo-backend
    ports:
      - "8081:8081"
    environment:
      - ECHO_PORT=8081
    restart: unless-stopped

  warden:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warden-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - UPSTREAM_URL=http://echo-backend:8081
      - REDIS_URL=redis:6379
      - LOG_LEVEL=info
      - ENV=development
    depends_on:
      redis:
        condition: service_healthy
      echo-backend:
        condition: service_started
    restart: unless-stopped

  admin-api:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: warden-admin-api
    ports:
      - "8082:8082"
    environment:
      - ADMIN_API_PORT=8082
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=warden
      - POSTGRES_PASSWORD=wardenpass
      - POSTGRES_DB=wardendb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
