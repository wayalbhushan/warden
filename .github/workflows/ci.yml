name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Run Static Analysis (go vet)
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Build Warden Gateway Binary
        run: go build -v -o bin/warden ./cmd/warden

      - name: Build Echo Server Binary
        run: go build -v -o bin/echo-server ./cmd/echo-server
